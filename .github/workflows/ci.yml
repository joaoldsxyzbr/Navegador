name: Chromium Overlay CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: chromium-overlay-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  validate-overlay:
    name: Validar overlay Chromium
    runs-on: windows-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validar estrutura
        shell: pwsh
        run: ./chromium/scripts/verify.ps1
