name: CI

on:
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build ${{ matrix.target }}
    runs-on: windows-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: net10.0-windows10.0.19041.0
            workload: maui-windows
            java: false
          - target: net10.0-android
            workload: maui-android
            java: true

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configurar .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Configurar Java 21
        if: matrix.java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Instalar workload
        shell: pwsh
        run: dotnet workload install ${{ matrix.workload }}

      - name: Restaurar
        shell: pwsh
        run: dotnet restore src/Navegador/Navegador.csproj -p:TargetFramework=${{ matrix.target }}

      - name: Compilar
        shell: pwsh
        run: dotnet build src/Navegador/Navegador.csproj -c Release -f ${{ matrix.target }} --no-restore
