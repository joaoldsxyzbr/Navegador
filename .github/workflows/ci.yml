name: WebView2 Windows CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: navegador-ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Testar lógica do Core
    runs-on: windows-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configurar .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Restaurar dependências
        run: dotnet restore desktop/Navegador.Tests/Navegador.Tests.csproj

      # O runner de testes do projeto é um executável sem dependências externas:
      # roda em qualquer máquina, com ou sem acesso ao NuGet.
      - name: Rodar testes
        run: dotnet run --project desktop/Navegador.Tests/Navegador.Tests.csproj --configuration Release --no-restore

  build:
    name: Compilar app Windows
    runs-on: windows-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configurar .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Restaurar dependências
        run: dotnet restore desktop/Navegador.Windows/Navegador.Windows.csproj -r win-x64

      - name: Publicar app para validar os pacotes
        run: dotnet publish desktop/Navegador.Windows/Navegador.Windows.csproj --configuration Release --runtime win-x64 --no-restore --output publish/Navegador

      - name: Compilar instalador opcional
        shell: pwsh
        run: |
          $version = (Get-Content VERSION -Raw).Trim()
          $compiler = Join-Path ${env:ProgramFiles(x86)} "Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $compiler)) { throw "Inno Setup não está disponível no runner: $compiler" }
          & $compiler "/DAppVersion=$version" installer/Rumo.iss
          if ($LASTEXITCODE -ne 0) { throw "A compilação do instalador falhou." }
          $installer = "dist/Rumo-v$version-windows-x64-setup.exe"
          if (-not (Test-Path $installer)) { throw "O instalador não foi gerado: $installer" }

      - name: Conferir se a versão publicada veio do arquivo VERSION
        shell: pwsh
        run: |
          $version = (Get-Content VERSION -Raw).Trim()
          dotnet msbuild desktop/Navegador.Windows/Navegador.Windows.csproj `
            -getProperty:Version -nologo |
            Out-String |
            ForEach-Object {
              if ($_ -notmatch [regex]::Escape($version)) {
                throw "A versão compilada não é a do arquivo VERSION ($version)."
              }
            }

          Write-Host "Versão conferida: $version"

  cefsharp-poc:
    name: Compilar PoC CEF/CefSharp
    if: github.event_name == 'pull_request' && github.head_ref == 'codex/cefsharp-extensions-poc'
    runs-on: windows-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configurar .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Restaurar CefSharp para Windows x64
        run: dotnet restore experiments/CefSharpExtensionsPoc/CefSharpExtensionsPoc.csproj --runtime win-x64

      - name: Publicar pacote de teste
        run: dotnet publish experiments/CefSharpExtensionsPoc/CefSharpExtensionsPoc.csproj --configuration Release --runtime win-x64 --self-contained true --no-restore --output artifacts/CefSharpPoc/win-x64

      - name: Compactar e medir o pacote
        shell: pwsh
        run: |
          Compress-Archive -Path "artifacts/CefSharpPoc/win-x64/*" -DestinationPath "artifacts/CefSharpPoc-win-x64.zip" -CompressionLevel Optimal
          $bytes = (Get-ChildItem "artifacts/CefSharpPoc/win-x64" -File -Recurse | Measure-Object -Property Length -Sum).Sum
          $zipBytes = (Get-Item "artifacts/CefSharpPoc-win-x64.zip").Length
          "Pasta publicada: $([math]::Round($bytes / 1MB, 1)) MB" >> $env:GITHUB_STEP_SUMMARY
          "ZIP de teste: $([math]::Round($zipBytes / 1MB, 1)) MB" >> $env:GITHUB_STEP_SUMMARY

      - name: Disponibilizar ZIP para teste manual
        uses: actions/upload-artifact@v4
        with:
          name: CefSharp-PoC-win-x64
          path: artifacts/CefSharpPoc-win-x64.zip
          retention-days: 7
