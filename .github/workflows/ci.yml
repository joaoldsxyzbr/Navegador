name: Chromium Overlay CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: chromium-overlay-\${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  validate-overlay:
    name: Validar overlay Chromium
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Validar estrutura
        shell: pwsh
        run: ./chromium/scripts/verify.ps1

  compile-portable-tools:
    name: Compilar ferramentas portáteis
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Configurar MSVC
        uses: ilammy/msvc-dev-cmd@v1
      - name: Compilar launcher
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path artifacts | Out-Null
          cl /nologo /std:c++17 /O2 /EHsc /utf-8 /MT /DUNICODE /D_UNICODE launcher/Navegador.cpp /link /SUBSYSTEM:WINDOWS user32.lib shell32.lib /OUT:artifacts/Navegador.exe
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Compilar atualizador
        shell: pwsh
        run: |
          cl /nologo /std:c++17 /O2 /EHsc /utf-8 /MT /DUNICODE /D_UNICODE updater/NavegadorUpdater.cpp /link /SUBSYSTEM:WINDOWS user32.lib winhttp.lib bcrypt.lib shell32.lib /OUT:"artifacts/Atualizar Navegador.exe"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Validar arquivos
        shell: pwsh
        run: |
          if (-not (Test-Path "artifacts/Navegador.exe")) { throw "Navegador.exe ausente." }
          if (-not (Test-Path "artifacts/Atualizar Navegador.exe")) { throw "Atualizador ausente." }
          if (-not (Test-Path "updater/apply-update.ps1")) { throw "Aplicador ausente." }
