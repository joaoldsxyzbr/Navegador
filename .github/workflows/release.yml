name: Release Windows

on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  release:
    name: Publicar Navegador v0.2.0
    if: github.event.head_commit.message == 'release: publish v0.2.0'
    runs-on: windows-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configurar .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Restaurar dependências
        run: dotnet restore desktop/Navegador.Windows/Navegador.Windows.csproj -r win-x64

      - name: Publicar Windows x64
        run: >
          dotnet publish desktop/Navegador.Windows/Navegador.Windows.csproj
          --configuration Release
          --runtime win-x64
          --self-contained true
          --no-restore
          -p:Version=0.2.0
          -p:DebugType=None
          -p:DebugSymbols=false
          --output publish/Navegador

      - name: Adicionar instruções ao pacote
        shell: pwsh
        run: |
          @"
          Navegador v0.2.0

          Esta é a primeira versão testável da nova base WebView2.

          Como usar:
          1. Extraia todo o conteúdo do ZIP para uma pasta com permissão de escrita.
          2. Execute Navegador.exe.
          3. O perfil será criado em Data\WebView2 ao lado do executável.

          Requisito:
          - Microsoft Edge WebView2 Runtime instalado no Windows.

          Incluído neste protótipo:
          - abas;
          - voltar, avançar e recarregar;
          - barra de endereço e pesquisa;
          - tema escuro;
          - perfil persistente portátil;
          - gerenciamento experimental de extensões Chromium por pasta descompactada.

          Ainda não incluído:
          - instalação direta pela Chrome Web Store;
          - favoritos e histórico visíveis;
          - gerenciador de downloads;
          - janela privada;
          - atualizador integrado.
          "@ | Set-Content -Encoding UTF8 publish/Navegador/LEIA-ME.txt

      - name: Empacotar
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force dist | Out-Null
          Compress-Archive -Path publish/Navegador/* -DestinationPath dist/Navegador-v0.2.0-windows-x64.zip -CompressionLevel Optimal
          $hash = (Get-FileHash dist/Navegador-v0.2.0-windows-x64.zip -Algorithm SHA256).Hash.ToLower()
          "$hash  Navegador-v0.2.0-windows-x64.zip" | Set-Content -Encoding ascii dist/Navegador-v0.2.0-windows-x64.zip.sha256

      - name: Preparar notas da release
        shell: pwsh
        run: |
          @"
          ## Navegador v0.2.0

          Primeira versão testável da nova arquitetura **C# + WinForms + WebView2**.

          ### Incluído
          - abas e navegação básica;
          - barra de endereço com pesquisa;
          - tema escuro e primeira interface inspirada no Chrome;
          - perfil persistente em `Data/WebView2`;
          - extensões WebView2 habilitadas;
          - instalação de extensões Chromium por pasta local descompactada;
          - ativar, desativar e remover extensões;
          - pacote Windows x64 self-contained para não exigir instalação separada do .NET 10.

          ### Requisito
          O **Microsoft Edge WebView2 Runtime** precisa estar instalado no Windows.

          ### Limitações conhecidas
          A instalação direta pela Chrome Web Store, ícones/popups de extensões, favoritos, histórico visível, downloads, janela privada e atualizador integrado ainda não fazem parte desta versão.

          Esta release é destinada a validação do MVP no Windows.
          "@ | Set-Content -Encoding UTF8 release-notes.md

      - name: Criar release no GitHub
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create v0.2.0 `
            dist/Navegador-v0.2.0-windows-x64.zip `
            dist/Navegador-v0.2.0-windows-x64.zip.sha256 `
            --target "${{ github.sha }}" `
            --title "Navegador v0.2.0" `
            --notes-file release-notes.md
