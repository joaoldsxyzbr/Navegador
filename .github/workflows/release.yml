name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag da versão já criada no repositório"
        required: true
        type: string

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build-windows:
    name: Empacotar Windows x64
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.ref }}

      - name: Configurar .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Instalar workload MAUI
        run: dotnet workload install maui-windows

      - name: Publicar versão portátil
        shell: pwsh
        run: |
          $tag = "${{ inputs.tag || github.ref_name }}"
          $version = $tag.TrimStart("v")
          $publishArgs = @(
            "publish",
            "src/Navegador/Navegador.csproj",
            "-f", "net10.0-windows10.0.19041.0",
            "-c", "Release",
            "-r", "win-x64",
            "-p:WindowsPackageType=None",
            "-p:WindowsAppSDKSelfContained=true",
            "-p:ApplicationDisplayVersion=$version",
            "-p:ApplicationVersion=${{ github.run_number }}",
            "-o", "artifacts/windows"
          )
          dotnet @publishArgs
          Compress-Archive -Path artifacts/windows/* -DestinationPath artifacts/Navegador-windows-x64.zip

      - name: Armazenar pacote Windows
        uses: actions/upload-artifact@v4
        with:
          name: Navegador-windows-x64
          path: artifacts/Navegador-windows-x64.zip
          if-no-files-found: error
          retention-days: 3

  build-android:
    name: Empacotar Android assinado
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.ref }}

      - name: Configurar .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Configurar Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Instalar workload MAUI
        run: dotnet workload install maui-android

      - name: Preparar keystore
        shell: pwsh
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          if ([string]::IsNullOrWhiteSpace($env:ANDROID_KEYSTORE_BASE64) -or
              [string]::IsNullOrWhiteSpace($env:ANDROID_KEYSTORE_PASSWORD) -or
              [string]::IsNullOrWhiteSpace($env:ANDROID_KEY_ALIAS) -or
              [string]::IsNullOrWhiteSpace($env:ANDROID_KEY_PASSWORD)) {
            throw "Configure os quatro segredos de assinatura Android descritos em docs/ATUALIZACOES.md."
          }
          $keyPath = Join-Path $env:RUNNER_TEMP "navegador-signing.keystore"
          [IO.File]::WriteAllBytes($keyPath, [Convert]::FromBase64String($env:ANDROID_KEYSTORE_BASE64))
          "ANDROID_KEYSTORE_PATH=$keyPath" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8

      - name: Publicar APK assinado
        shell: pwsh
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          $tag = "${{ inputs.tag || github.ref_name }}"
          $version = $tag.TrimStart("v")
          $publishArgs = @(
            "publish",
            "src/Navegador/Navegador.csproj",
            "-f", "net10.0-android",
            "-c", "Release",
            "-p:AndroidPackageFormat=apk",
            "-p:AndroidKeyStore=true",
            "-p:AndroidSigningKeyStore=$env:ANDROID_KEYSTORE_PATH",
            "-p:AndroidSigningStorePass=$env:ANDROID_KEYSTORE_PASSWORD",
            "-p:AndroidSigningKeyAlias=$env:ANDROID_KEY_ALIAS",
            "-p:AndroidSigningKeyPass=$env:ANDROID_KEY_PASSWORD",
            "-p:ApplicationDisplayVersion=$version",
            "-p:ApplicationVersion=${{ github.run_number }}",
            "-o", "artifacts/android"
          )
          dotnet @publishArgs
          $apk = Get-ChildItem artifacts/android -Filter "*.apk" -Recurse | Select-Object -First 1
          if ($null -eq $apk) { throw "O APK assinado não foi gerado." }
          Copy-Item $apk.FullName artifacts/Navegador-android.apk

      - name: Armazenar APK
        uses: actions/upload-artifact@v4
        with:
          name: Navegador-android
          path: artifacts/Navegador-android.apk
          if-no-files-found: error
          retention-days: 3

  publish:
    name: Publicar release
    runs-on: ubuntu-latest
    needs:
      - build-windows
      - build-android
    steps:
      - name: Baixar artefatos
        uses: actions/download-artifact@v4
        with:
          path: release-assets

      - name: Criar release com os pacotes
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
        run: |
          gh release create "$RELEASE_TAG" release-assets/Navegador-windows-x64/Navegador-windows-x64.zip release-assets/Navegador-android/Navegador-android.apk --generate-notes --verify-tag
