name: Release Windows

on:
  push:
    tags:
      - 'v*.*.*'

permissions:
  contents: write

concurrency:
  group: navegador-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    name: Publicar pacote Windows x64
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Configurar .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - name: Ler e validar versão
        id: version
        shell: pwsh
        run: |
          $version = (Get-Content VERSION -Raw).Trim()
          if ($version -notmatch '^\d+\.\d+\.\d+$') { throw "VERSION inválido: '$version'." }
          if ("${{ github.ref_name }}" -ne "v$version") { throw "A tag ${{ github.ref_name }} não combina com VERSION ($version)." }
          "version=$version" >> $env:GITHUB_OUTPUT
      - name: Rodar testes do Core
        run: dotnet run --project desktop/Navegador.Tests/Navegador.Tests.csproj --configuration Release
      - name: Restaurar dependências
        run: dotnet restore desktop/Navegador.Windows/Navegador.Windows.csproj -r win-x64
      - name: Publicar Windows x64 em arquivo único
        run: dotnet publish desktop/Navegador.Windows/Navegador.Windows.csproj --configuration Release --runtime win-x64 --self-contained true --no-restore -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true -p:PublishTrimmed=false -p:DebugType=None -p:DebugSymbols=false --output publish/Navegador
      - name: Validar pacote
        shell: pwsh
        run: |
          if (-not (Test-Path publish/Navegador/Navegador.exe)) { throw "Navegador.exe não foi gerado." }
          $files = @(Get-ChildItem publish/Navegador -Recurse -File)
          if ($files.Count -gt 2) { throw "Pacote poluído: $($files.Count) arquivos antes do LEIA-ME." }
          $info = (Get-Item publish/Navegador/Navegador.exe).VersionInfo
          if ($info.ProductVersion -notlike "${{ steps.version.outputs.version }}*") { throw "Versão publicada incorreta: '$($info.ProductVersion)'." }
      - name: Adicionar instruções
        shell: pwsh
        run: |
          $version = "${{ steps.version.outputs.version }}"
          @"
          NAVEGADOR v$version

          PARA ABRIR:
          1. Extraia todo o ZIP.
          2. Abra Navegador.exe.

          Atualizações:
          - use o botão Atualizar na barra superior ou Menu (⋮) > Atualizar Navegador.

          Dados:
          - o modo portátil usa Data\ ao lado do executável;
          - se a pasta não for gravável, o fallback é %LOCALAPPDATA%\Navegador.

          Requisito:
          - Microsoft Edge WebView2 Runtime.
          "@ | Set-Content -Encoding UTF8 publish/Navegador/LEIA-ME.txt
      - name: Empacotar
        shell: pwsh
        run: |
          $version = "${{ steps.version.outputs.version }}"
          New-Item -ItemType Directory -Force dist | Out-Null
          $zip = "dist/Navegador-v$version-windows-x64.zip"
          Compress-Archive -Path publish/Navegador/* -DestinationPath $zip -CompressionLevel Optimal
          $hash = (Get-FileHash $zip -Algorithm SHA256).Hash.ToLower()
          "$hash  Navegador-v$version-windows-x64.zip" | Set-Content -Encoding ascii "$zip.sha256"
      - name: Notas da release
        shell: pwsh
        run: |
          $version = "${{ steps.version.outputs.version }}"
          @"
          ## Navegador v$version

          - Core separado e testável;
          - sessão, favoritos, histórico, downloads e configurações;
          - nova guia própria e shell refinado;
          - atualização integrada com SHA-256, handshake e rollback;
          - pacote Windows x64 portátil em arquivo único.

          Baixe o ZIP, extraia e abra Navegador.exe.
          "@ | Set-Content -Encoding UTF8 release-notes.md
      - name: Criar release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $version = "${{ steps.version.outputs.version }}"
          gh release create "${{ github.ref_name }}" "dist/Navegador-v$version-windows-x64.zip" "dist/Navegador-v$version-windows-x64.zip.sha256" --target "${{ github.sha }}" --title "Navegador v$version" --notes-file release-notes.md
