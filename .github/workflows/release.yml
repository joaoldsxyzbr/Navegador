name: Release Windows

on:
  push:
    tags:
      - 'v*.*.*'
    branches:
      - 'release/v*.*.*'

permissions:
  contents: write

concurrency:
  group: navegador-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    name: Publicar pacote Windows x64
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Configurar .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - name: Ler e validar versão
        id: version
        shell: pwsh
        run: |
          $version = (Get-Content VERSION -Raw).Trim()
          if ($version -notmatch '^\d+\.\d+\.\d+$') { throw "VERSION inválido: '$version'." }
          $tag = "v$version"
          if ("${{ github.ref_type }}" -eq "tag") {
            if ("${{ github.ref_name }}" -ne $tag) { throw "A tag ${{ github.ref_name }} não combina com VERSION ($version)." }
          } elseif ("${{ github.ref_type }}" -eq "branch") {
            if ("${{ github.ref_name }}" -ne "release/$tag") { throw "A branch ${{ github.ref_name }} não combina com VERSION ($version)." }
          } else {
            throw "Tipo de referência não suportado: ${{ github.ref_type }}."
          }
          "version=$version" >> $env:GITHUB_OUTPUT
          "tag=$tag" >> $env:GITHUB_OUTPUT
      - name: Rodar testes do Core
        run: dotnet run --project desktop/Navegador.Tests/Navegador.Tests.csproj --configuration Release
      - name: Restaurar dependências
        run: dotnet restore desktop/Navegador.Windows/Navegador.Windows.csproj -r win-x64
      - name: Publicar Windows x64 com Chromium incluído
        run: dotnet publish desktop/Navegador.Windows/Navegador.Windows.csproj --configuration Release --runtime win-x64 --self-contained true --no-restore -p:PublishSingleFile=false -p:PublishTrimmed=false -p:DebugType=None -p:DebugSymbols=false --output publish/Navegador
      - name: Limpar documentação de dependências
        shell: pwsh
        run: |
          Get-ChildItem publish/Navegador -File -Filter "*.xml" | Remove-Item -Force
      - name: Incluir licenças do CefSharp e do Chromium
        shell: pwsh
        run: |
          $packagesRoot = Join-Path $env:USERPROFILE ".nuget/packages"
          $noticeRoot = "publish/Navegador/TERCEIROS"
          New-Item -ItemType Directory -Force $noticeRoot | Out-Null
          $packages = @(Get-ChildItem $packagesRoot -Directory | Where-Object { $_.Name -match "cefsharp|chromiumembeddedframework" })
          foreach ($package in $packages) {
            $licenseFiles = @(Get-ChildItem $package.FullName -Recurse -File | Where-Object { $_.Name -match "^(LICENSE|LICENSES|NOTICE)(\..*)?$" })
            foreach ($license in $licenseFiles) {
              $relative = [IO.Path]::GetRelativePath($package.FullName, $license.FullName)
              $destination = Join-Path (Join-Path $noticeRoot $package.Name) $relative
              New-Item -ItemType Directory -Force (Split-Path $destination) | Out-Null
              Copy-Item $license.FullName $destination -Force
            }
          }
          $included = @(Get-ChildItem $noticeRoot -Recurse -File)
          if ($included.Count -eq 0) { throw "As licenças dos pacotes CefSharp/Chromium não foram encontradas no cache NuGet." }
          Write-Host "Arquivos de licença incluídos: $($included.Count)"
      - name: Validar pacote
        shell: pwsh
        run: |
          $required = @("Navegador.exe", "CefSharp.BrowserSubprocess.exe", "libcef.dll", "icudtl.dat", "resources.pak")
          foreach ($file in $required) {
            $path = Join-Path "publish/Navegador" $file
            if (-not (Test-Path $path)) { throw "Arquivo obrigatório do CefSharp/Chromium ausente: $path" }
          }
          $files = @(Get-ChildItem publish/Navegador -Recurse -File)
          $relativeFiles = @($files | ForEach-Object { [IO.Path]::GetRelativePath((Resolve-Path "publish/Navegador"), $_.FullName) })
          Write-Host ("Arquivos publicados: " + ($relativeFiles -join ", "))
          $debugFiles = @($files | Where-Object { $_.Extension -in ".pdb", ".xml" })
          if ($debugFiles.Count -gt 0) { throw "Pacote contém artefatos de depuração/documentação: $($debugFiles.Name -join ', ')." }
          $info = (Get-Item publish/Navegador/Navegador.exe).VersionInfo
          if ($info.ProductVersion -notlike "${{ steps.version.outputs.version }}*") { throw "Versão publicada incorreta: '$($info.ProductVersion)'." }
      - name: Adicionar instruções
        shell: pwsh
        run: |
          $version = "${{ steps.version.outputs.version }}"
          @"
          RUMO v$version

          PARA ABRIR:
          1. Extraia todo o ZIP.
          2. Abra Navegador.exe.

          Atualizações:
          - use o botão Atualizar na barra superior ou Menu (⋮) > Atualizar Navegador.

          Dados:
          - o modo portátil usa Data\ ao lado do executável;
          - se a pasta não for gravável, o fallback é %LOCALAPPDATA%\Navegador.

          Requisito:
          - Windows 10/11 x64. O CefSharp e os arquivos do Chromium já estão incluídos.
          "@ | Set-Content -Encoding UTF8 publish/Navegador/LEIA-ME.txt
      - name: Empacotar
        shell: pwsh
        run: |
          $version = "${{ steps.version.outputs.version }}"
          New-Item -ItemType Directory -Force dist | Out-Null
          $zip = "dist/Rumo-v$version-windows-x64.zip"
          Compress-Archive -Path publish/Navegador/* -DestinationPath $zip -CompressionLevel Optimal
          $hash = (Get-FileHash $zip -Algorithm SHA256).Hash.ToLower()
          "$hash  Rumo-v$version-windows-x64.zip" | Set-Content -Encoding ascii "$zip.sha256"
      - name: Compilar instalador opcional
        shell: pwsh
        run: |
          $version = "${{ steps.version.outputs.version }}"
          $compiler = Join-Path ${env:ProgramFiles(x86)} "Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $compiler)) { throw "Inno Setup não está disponível no runner: $compiler" }
          & $compiler "/DAppVersion=$version" installer/Rumo.iss
          if ($LASTEXITCODE -ne 0) { throw "A compilação do instalador falhou." }
          $setup = "dist/Rumo-v$version-windows-x64-setup.exe"
          if (-not (Test-Path $setup)) { throw "O instalador não foi gerado: $setup" }
          $setupHash = (Get-FileHash $setup -Algorithm SHA256).Hash.ToLower()
          "$setupHash  Rumo-v$version-windows-x64-setup.exe" | Set-Content -Encoding ascii "$setup.sha256"
      - name: Notas da release
        shell: pwsh
        run: |
          $version = "${{ steps.version.outputs.version }}"
          @"
          ## Rumo v$version

          - Core separado e testável;
          - sessão, favoritos, histórico, downloads e configurações;
          - nova guia própria e shell refinado;
          - atualização integrada com SHA-256, handshake e rollback;
          - abas reordenáveis, favicons, abas fixas, sugestões na barra de endereço e tela cheia;
          - janela privada com contexto Chromium isolado e limpeza de dados;
          - CefSharp com Chromium incluído no pacote, sem exigir Edge WebView2 Runtime;
          - licenças dos componentes de terceiros dentro do pacote;
          - ZIP portátil e instalador opcional sem exigir administrador.

          Para usar o ZIP, extraia e abra Navegador.exe. O instalador cria atalhos e mantém o ZIP portátil disponível.
          "@ | Set-Content -Encoding UTF8 release-notes.md
      - name: Criar release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $version = "${{ steps.version.outputs.version }}"
          $tag = "${{ steps.version.outputs.tag }}"
          $files = @(
            "dist/Rumo-v$version-windows-x64.zip",
            "dist/Rumo-v$version-windows-x64.zip.sha256",
            "dist/Rumo-v$version-windows-x64-setup.exe",
            "dist/Rumo-v$version-windows-x64-setup.exe.sha256"
          )
          gh release view $tag --json tagName 2>$null
          $releaseExists = $LASTEXITCODE -eq 0
          if ($releaseExists) {
            gh release upload $tag @files --clobber
            if ($LASTEXITCODE -ne 0) { throw "O upload dos pacotes para a release existente falhou." }
            gh release edit $tag --title "Rumo v$version" --notes-file release-notes.md
          } else {
            gh release create $tag @files --target "${{ github.sha }}" --title "Rumo v$version" --notes-file release-notes.md
          }
          if ($LASTEXITCODE -ne 0) { throw "A publicação da release falhou." }
