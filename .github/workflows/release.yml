name: Release Windows

on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  release:
    name: Publicar Navegador v0.4.0
    if: contains(github.event.head_commit.message, '[publish-v0.4.0]')
    runs-on: windows-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configurar .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Restaurar dependências
        run: dotnet restore desktop/Navegador.Windows/Navegador.Windows.csproj -r win-x64

      - name: Publicar Windows x64 em arquivo único
        run: >
          dotnet publish desktop/Navegador.Windows/Navegador.Windows.csproj
          --configuration Release
          --runtime win-x64
          --self-contained true
          --no-restore
          -p:Version=0.4.0
          -p:PublishSingleFile=true
          -p:IncludeNativeLibrariesForSelfExtract=true
          -p:PublishTrimmed=false
          -p:DebugType=None
          -p:DebugSymbols=false
          --output publish/Navegador

      - name: Limpar arquivos de documentação técnica
        shell: pwsh
        run: |
          Get-ChildItem publish/Navegador -Recurse -File -Include *.xml,*.pdb | Remove-Item -Force

      - name: Validar pacote simples
        shell: pwsh
        run: |
          if (-not (Test-Path publish/Navegador/Navegador.exe)) {
            throw "Navegador.exe não foi gerado na raiz do pacote."
          }

          $files = @(Get-ChildItem publish/Navegador -Recurse -File)
          $files | ForEach-Object { Write-Host $_.FullName }

          if ($files.Count -gt 2) {
            throw "O pacote ainda ficou poluído: $($files.Count) arquivos de runtime. Esperado: Navegador.exe e, no máximo, um loader nativo."
          }

      - name: Adicionar instruções ao pacote
        shell: pwsh
        run: |
          @"
          NAVEGADOR v0.4.0

          PARA ABRIR:
          Dê dois cliques em Navegador.exe.

          O Navegador.exe fica nesta mesma pasta, sem precisar procurar dentro de subpastas.

          Requisito:
          - Microsoft Edge WebView2 Runtime instalado no Windows.

          Dados portáteis:
          - o perfil será criado em Data\WebView2 ao lado do Navegador.exe.

          Atualizações:
          - use o botão ⇩ na barra superior ou a opção Atualizar Navegador no menu.
          "@ | Set-Content -Encoding UTF8 publish/Navegador/LEIA-ME.txt

      - name: Empacotar
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force dist | Out-Null
          Compress-Archive -Path publish/Navegador/* -DestinationPath dist/Navegador-v0.4.0-windows-x64.zip -CompressionLevel Optimal
          $hash = (Get-FileHash dist/Navegador-v0.4.0-windows-x64.zip -Algorithm SHA256).Hash.ToLower()
          "$hash  Navegador-v0.4.0-windows-x64.zip" | Set-Content -Encoding ascii dist/Navegador-v0.4.0-windows-x64.zip.sha256

      - name: Preparar notas da release
        shell: pwsh
        run: |
          @"
          ## Navegador v0.4.0

          Atualização integrada diretamente no Navegador.

          ### O que mudou
          - novo botão de **Atualizar Navegador** na barra superior;
          - opção de atualização também no menu principal;
          - consulta automática da release mais recente no GitHub ao clicar;
          - comparação entre a versão instalada e a versão disponível;
          - download do ZIP oficial Windows x64;
          - validação SHA-256 antes de instalar;
          - o próprio `Navegador.exe` atua temporariamente como helper, substitui a versão antiga e reinicia o app;
          - `Data/WebView2` é preservado durante a atualização;
          - o pacote continua com um único executável principal na raiz.

          ### Como usar
          1. Baixe `Navegador-v0.4.0-windows-x64.zip`.
          2. Extraia o ZIP.
          3. Abra `Navegador.exe`.

          ### Requisito
          O **Microsoft Edge WebView2 Runtime** precisa estar instalado no Windows.

          A partir desta versão, futuras releases podem ser instaladas pelo próprio Navegador usando o botão de atualização.
          "@ | Set-Content -Encoding UTF8 release-notes.md

      - name: Criar release no GitHub
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create v0.4.0 `
            dist/Navegador-v0.4.0-windows-x64.zip `
            dist/Navegador-v0.4.0-windows-x64.zip.sha256 `
            --target "${{ github.sha }}" `
            --title "Navegador v0.4.0" `
            --notes-file release-notes.md
