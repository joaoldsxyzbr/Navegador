name: Release Chromium Bootstrap

on:
  push:
    branches:
      - main
    paths:
      - "release/REQUEST"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: navegador-release-v2
  cancel-in-progress: true

jobs:
  package-windows:
    name: Gerar Windows x64 portátil
    runs-on: windows-latest
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configurar MSVC
        uses: ilammy/msvc-dev-cmd@v1

      - name: Ler versões
        shell: pwsh
        run: |
          $version = (Get-Content VERSION -Raw).Trim()
          $requested = if (Test-Path release/REQUEST) { (Get-Content release/REQUEST -Raw).Trim() } else { $version }
          if ($requested -ne $version) {
            throw "release/REQUEST ($requested) não corresponde a VERSION ($version)."
          }
          $snapshot = (Get-Content bootstrap/SNAPSHOT_REVISION -Raw).Trim()
          "PRODUCT_VERSION=$version" | Out-File $env:GITHUB_ENV -Append -Encoding utf8
          "SNAPSHOT_REVISION=$snapshot" | Out-File $env:GITHUB_ENV -Append -Encoding utf8

      - name: Compilar launcher e atualizador
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path artifacts/tools | Out-Null
          cl /nologo /std:c++17 /O2 /EHsc /utf-8 /MT /DUNICODE /D_UNICODE launcher/Navegador.cpp /link /SUBSYSTEM:WINDOWS user32.lib shell32.lib /OUT:artifacts/tools/Navegador.exe
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          cl /nologo /std:c++17 /O2 /EHsc /utf-8 /MT /DUNICODE /D_UNICODE updater/NavegadorUpdater.cpp /link /SUBSYSTEM:WINDOWS user32.lib winhttp.lib bcrypt.lib shell32.lib /OUT:"artifacts/tools/Atualizar Navegador.exe"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Baixar Chromium bootstrap fixado
        shell: pwsh
        run: |
          $url = "https://storage.googleapis.com/chromium-browser-snapshots/Win_x64/$env:SNAPSHOT_REVISION/chrome-win.zip"
          Write-Host "Baixando Chromium snapshot r$env:SNAPSHOT_REVISION"
          Invoke-WebRequest -Uri $url -OutFile chromium-bootstrap.zip
          Expand-Archive chromium-bootstrap.zip -DestinationPath chromium-bootstrap -Force
          $chrome = Get-ChildItem chromium-bootstrap -Filter chrome.exe -Recurse | Select-Object -First 1
          if ($null -eq $chrome) { throw "Snapshot não contém chrome.exe." }
          "CHROMIUM_APP_DIR=$($chrome.Directory.FullName)" | Out-File $env:GITHUB_ENV -Append -Encoding utf8

      - name: Montar pacote portátil
        shell: pwsh
        run: |
          $package = "artifacts/package"
          New-Item -ItemType Directory -Force -Path "$package/App" | Out-Null
          New-Item -ItemType Directory -Force -Path "$package/Updater" | Out-Null
          Copy-Item "$env:CHROMIUM_APP_DIR/*" "$package/App" -Recurse -Force
          Copy-Item "artifacts/tools/Navegador.exe" "$package/Navegador.exe"
          Copy-Item "artifacts/tools/Atualizar Navegador.exe" "$package/Atualizar Navegador.exe"
          Copy-Item "updater/apply-update.ps1" "$package/Updater/apply-update.ps1"
          Copy-Item "bootstrap/README.md" "$package/NOTICE.txt"
          Set-Content -Path "$package/version.txt" -Value $env:PRODUCT_VERSION -NoNewline
          if (-not (Test-Path "$package/App/chrome.exe")) { throw "Pacote final não contém App/chrome.exe." }

      - name: Smoke test do Chromium
        shell: pwsh
        run: |
          $profile = Join-Path $env:RUNNER_TEMP "navegador-smoke-profile"
          $chrome = (Resolve-Path "artifacts/package/App/chrome.exe").Path
          $appDir = Split-Path $chrome
          $arguments = @(
            "--headless",
            "--no-sandbox",
            "--disable-dev-shm-usage",
            "--disable-gpu",
            "--disable-background-networking",
            "--no-first-run",
            "--remote-debugging-port=0",
            "--user-data-dir=$profile",
            "about:blank"
          )

          $process = Start-Process -FilePath $chrome -ArgumentList $arguments -PassThru -WindowStyle Hidden
          $activePortFile = Join-Path $profile "DevToolsActivePort"
          $deadline = [DateTime]::UtcNow.AddSeconds(30)
          while ([DateTime]::UtcNow -lt $deadline -and -not (Test-Path $activePortFile)) {
            if ($process.HasExited) {
              throw "Chromium bootstrap encerrou antes de ficar pronto. Código: $($process.ExitCode)"
            }
            Start-Sleep -Milliseconds 250
          }

          if (-not (Test-Path $activePortFile)) {
            throw "Chromium bootstrap não publicou DevToolsActivePort em 30 segundos."
          }

          $lines = Get-Content $activePortFile
          $port = [int]$lines[0]
          $version = Invoke-RestMethod -Uri "http://127.0.0.1:$port/json/version" -TimeoutSec 5
          if ([string]::IsNullOrWhiteSpace($version.Browser)) {
            throw "Endpoint DevTools não informou a versão do navegador."
          }
          Write-Host "Chromium pronto: $($version.Browser)"

          Get-CimInstance Win32_Process -Filter "Name = 'chrome.exe'" -ErrorAction SilentlyContinue |
            Where-Object { $_.ExecutablePath -and $_.ExecutablePath.StartsWith($appDir, [StringComparison]::OrdinalIgnoreCase) } |
            ForEach-Object { Stop-Process -Id $_.ProcessId -Force -ErrorAction SilentlyContinue }

      - name: Compactar e gerar manifesto
        shell: pwsh
        run: |
          Compress-Archive -Path "artifacts/package/*" -DestinationPath "artifacts/Navegador-windows-x64.zip" -CompressionLevel Optimal
          $hash = (Get-FileHash "artifacts/Navegador-windows-x64.zip" -Algorithm SHA256).Hash.ToLowerInvariant()
          $assetUrl = "https://github.com/${{ github.repository }}/releases/download/v$env:PRODUCT_VERSION/Navegador-windows-x64.zip"
          $manifest = [ordered]@{
            schema = 1
            version = $env:PRODUCT_VERSION
            platform = "windows-x64"
            url = $assetUrl
            sha256 = $hash
          }
          $manifest | ConvertTo-Json | Set-Content "artifacts/update.json" -Encoding utf8
          Set-Content "artifacts/Navegador-windows-x64.zip.sha256" "$hash  Navegador-windows-x64.zip" -Encoding ascii

      - name: Validar pacote
        shell: pwsh
        run: |
          $testDir = Join-Path $env:RUNNER_TEMP "navegador-package-test"
          Expand-Archive "artifacts/Navegador-windows-x64.zip" -DestinationPath $testDir -Force
          $required = @("Navegador.exe","Atualizar Navegador.exe","App/chrome.exe","Updater/apply-update.ps1","version.txt","NOTICE.txt")
          foreach ($item in $required) {
            if (-not (Test-Path (Join-Path $testDir $item))) { throw "Arquivo ausente no pacote: $item" }
          }
          $version = (Get-Content (Join-Path $testDir "version.txt") -Raw).Trim()
          if ($version -ne $env:PRODUCT_VERSION) { throw "Versão empacotada incorreta: $version" }
          $manifest = Get-Content "artifacts/update.json" -Raw | ConvertFrom-Json
          $actual = (Get-FileHash "artifacts/Navegador-windows-x64.zip" -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($manifest.sha256 -ne $actual) { throw "SHA-256 do manifesto não confere." }

      - name: Armazenar artefatos
        uses: actions/upload-artifact@v4
        with:
          name: Navegador-v${{ env.PRODUCT_VERSION }}-windows-x64
          path: |
            artifacts/Navegador-windows-x64.zip
            artifacts/Navegador-windows-x64.zip.sha256
            artifacts/update.json
          if-no-files-found: error
          retention-days: 7

  publish:
    name: Publicar release
    runs-on: ubuntu-latest
    needs: package-windows

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Ler versão
        id: version
        shell: bash
        run: echo "version=$(tr -d '\r\n ' < VERSION)" >> "$GITHUB_OUTPUT"

      - name: Baixar artefatos
        uses: actions/download-artifact@v4
        with:
          name: Navegador-v${{ steps.version.outputs.version }}-windows-x64
          path: release-assets

      - name: Criar release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.version.outputs.version }}
        shell: bash
        run: |
          tag="v$VERSION"
          if gh release view "$tag" >/dev/null 2>&1; then
            gh release upload "$tag" release-assets/Navegador-windows-x64.zip release-assets/Navegador-windows-x64.zip.sha256 release-assets/update.json --clobber
          else
            gh release create "$tag" release-assets/Navegador-windows-x64.zip release-assets/Navegador-windows-x64.zip.sha256 release-assets/update.json --target "$GITHUB_SHA" --title "Navegador v$VERSION" --notes-file bootstrap/RELEASE_NOTES.md
          fi
