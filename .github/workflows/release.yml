name: Release Windows

# Publicar é uma etiqueta, não uma frase no commit:
#   1. edite VERSION
#   2. git commit -am "release: v0.5.0"
#   3. git tag v0.5.0 && git push origin main --tags
# A versão do pacote vem do arquivo VERSION; a etiqueta precisa combinar com ele.
on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: navegador-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    name: Publicar pacote Windows x64
    runs-on: windows-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configurar .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Ler a versão do arquivo VERSION
        id: version
        shell: pwsh
        run: |
          $version = (Get-Content VERSION -Raw).Trim()

          if ($version -notmatch '^\d+\.\d+\.\d+$') {
            throw "VERSION precisa estar no formato X.Y.Z, e está '$version'."
          }

          if ("${{ github.ref_type }}" -eq "tag" -and "${{ github.ref_name }}" -ne "v$version") {
            throw "A etiqueta ${{ github.ref_name }} não combina com VERSION ($version)."
          }

          "version=$version" >> $env:GITHUB_OUTPUT
          Write-Host "Versão da release: $version"

      - name: Rodar testes
        run: dotnet run --project desktop/Navegador.Tests/Navegador.Tests.csproj --configuration Release

      - name: Restaurar dependências
        run: dotnet restore desktop/Navegador.Windows/Navegador.Windows.csproj -r win-x64

      - name: Publicar Windows x64 em arquivo único
        shell: pwsh
        run: >
          dotnet publish desktop/Navegador.Windows/Navegador.Windows.csproj
          --configuration Release
          --runtime win-x64
          --self-contained true
          --no-restore
          -p:PublishSingleFile=true
          -p:IncludeNativeLibrariesForSelfExtract=true
          -p:PublishTrimmed=false
          -p:DebugType=None
          -p:DebugSymbols=false
          --output publish/Navegador

      - name: Validar o pacote
        shell: pwsh
        run: |
          if (-not (Test-Path publish/Navegador/Navegador.exe)) {
            throw "Navegador.exe não foi gerado na raiz do pacote."
          }

          $files = @(Get-ChildItem publish/Navegador -Recurse -File)
          $files | ForEach-Object { Write-Host $_.FullName }

          if ($files.Count -gt 2) {
            throw "O pacote ficou poluído: $($files.Count) arquivos. Esperado: Navegador.exe e, no máximo, um loader nativo."
          }

          # A versão vem do VERSION, via Directory.Build.props. Se alguém
          # voltar a fixar a versão no csproj, isto avisa.
          $info = (Get-Item publish/Navegador/Navegador.exe).VersionInfo
          if ($info.ProductVersion -notlike "${{ steps.version.outputs.version }}*") {
            throw "O executável publicado está com a versão '$($info.ProductVersion)'."
          }

      - name: Adicionar instruções ao pacote
        shell: pwsh
        run: |
          $version = "${{ steps.version.outputs.version }}"
          @"
          NAVEGADOR v$version

          PARA ABRIR:
          Dê dois cliques em Navegador.exe.

          O Navegador.exe fica nesta mesma pasta, sem precisar procurar dentro de subpastas.

          Requisito:
          - Microsoft Edge WebView2 Runtime instalado no Windows.

          Dados:
          - o Navegador tenta manter tudo em Data\, ao lado do Navegador.exe.
          - se essa pasta não puder ser criada (por exemplo em Program Files sem
            permissão), os dados vão para %LOCALAPPDATA%\Navegador.

          Atualizações:
          - use Menu (â) > Atualizar Navegador; o pacote é conferido por SHA-256
            antes de substituir os arquivos.
          "@ | Set-Content -Encoding UTF8 publish/Navegador/LEIA-ME.txt

      - name: Empacotar
        shell: pwsh
        run: |
          $version = "${{ steps.version.outputs.version }}"
          $zip = "dist/Navegador-v$version-windows-x64.zip"

          New-Item -ItemType Directory -Force dist | Out-Null
          Compress-Archive -Path publish/Navegador/* -DestinationPath $zip -CompressionLevel Optimal

          $hash = (Get-FileHash $zip -Algorithm SHA256).Hash.ToLower()
          "$hash  Navegador-v$version-windows-x64.zip" |
            Set-Content -Encoding ascii "$zip.sha256"

          Write-Host "SHA-256: $hash"

      - name: Preparar notas da release
        shell: pwsh
        run: |
          $version = "${{ steps.version.outputs.version }}"
          @"
          ## Navegador v$version

          ### Como usar
          1. Baixe ``Navegador-v$version-windows-x64.zip``.
          2. Extraia o ZIP inteiro.
          3. Abra ``Navegador.exe`` na raiz da pasta.

          ### Requisito
          O **Microsoft Edge WebView2 Runtime** precisa estar instalado no Windows.

          ### Atualizações
          Use **Menu › Atualizar Navegador**. O pacote é baixado do GitHub Releases,
          conferido por SHA-256 e instalado por um processo auxiliar que reinicia o
          Navegador. Se a cópia de algum arquivo falhar, a versão anterior é
          restaurada automaticamente.
          "@ | Set-Content -Encoding UTF8 release-notes.md

      - name: Criar release no GitHub
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $version = "${{ steps.version.outputs.version }}"
          $tag = if ("${{ github.ref_type }}" -eq "tag") { "${{ github.ref_name }}" } else { "v$version" }

          gh release create $tag `
            "dist/Navegador-v$version-windows-x64.zip" `
            "dist/Navegador-v$version-windows-x64.zip.sha256" `
            --target "${{ github.sha }}" `
            --title "Navegador v$version" `
            --notes-file release-notes.md
