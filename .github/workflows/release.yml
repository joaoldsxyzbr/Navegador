name: Release Windows

on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  release:
    name: Publicar Navegador v0.2.1
    if: contains(github.event.head_commit.message, '[publish-v0.2.1]')
    runs-on: windows-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configurar .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Restaurar dependências
        run: dotnet restore desktop/Navegador.Windows/Navegador.Windows.csproj -r win-x64

      - name: Publicar Windows x64 em arquivo único
        run: >
          dotnet publish desktop/Navegador.Windows/Navegador.Windows.csproj
          --configuration Release
          --runtime win-x64
          --self-contained true
          --no-restore
          -p:Version=0.2.1
          -p:PublishSingleFile=true
          -p:IncludeNativeLibrariesForSelfExtract=true
          -p:PublishTrimmed=false
          -p:DebugType=None
          -p:DebugSymbols=false
          --output publish/Navegador

      - name: Limpar arquivos de documentação técnica
        shell: pwsh
        run: |
          Get-ChildItem publish/Navegador -Recurse -File -Include *.xml,*.pdb | Remove-Item -Force

      - name: Validar pacote simples
        shell: pwsh
        run: |
          if (-not (Test-Path publish/Navegador/Navegador.exe)) {
            throw "Navegador.exe não foi gerado na raiz do pacote."
          }

          $files = @(Get-ChildItem publish/Navegador -Recurse -File)
          $files | ForEach-Object { Write-Host $_.FullName }

          if ($files.Count -gt 2) {
            throw "O pacote ainda ficou poluído: $($files.Count) arquivos de runtime. Esperado: Navegador.exe e, no máximo, um loader nativo."
          }

      - name: Adicionar instruções ao pacote
        shell: pwsh
        run: |
          @"
          NAVEGADOR v0.2.1

          PARA ABRIR:
          Dê dois cliques em Navegador.exe.

          O Navegador.exe fica nesta mesma pasta, sem precisar procurar dentro de subpastas.

          Requisito:
          - Microsoft Edge WebView2 Runtime instalado no Windows.

          Dados portáteis:
          - o perfil será criado em Data\WebView2 ao lado do Navegador.exe.
          "@ | Set-Content -Encoding UTF8 publish/Navegador/LEIA-ME.txt

      - name: Empacotar
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force dist | Out-Null
          Compress-Archive -Path publish/Navegador/* -DestinationPath dist/Navegador-v0.2.1-windows-x64.zip -CompressionLevel Optimal
          $hash = (Get-FileHash dist/Navegador-v0.2.1-windows-x64.zip -Algorithm SHA256).Hash.ToLower()
          "$hash  Navegador-v0.2.1-windows-x64.zip" | Set-Content -Encoding ascii dist/Navegador-v0.2.1-windows-x64.zip.sha256

      - name: Preparar notas da release
        shell: pwsh
        run: |
          @"
          ## Navegador v0.2.1

          Release de organização da distribuição Windows.

          ### O que mudou
          - o app agora é publicado como **single-file self-contained**;
          - `Navegador.exe` fica diretamente na raiz do ZIP;
          - removida a floresta de DLLs do .NET que aparecia na v0.2.0;
          - o workflow falha automaticamente se o pacote voltar a sair poluído;
          - instruções de uso ficam ao lado do executável.

          ### Como usar
          1. Baixe `Navegador-v0.2.1-windows-x64.zip`.
          2. Extraia o ZIP.
          3. Abra `Navegador.exe`.

          ### Requisito
          O **Microsoft Edge WebView2 Runtime** precisa estar instalado no Windows.

          Esta versão mantém as funcionalidades WebView2 da v0.2.0; a mudança principal é tornar o pacote portátil realmente simples de usar.
          "@ | Set-Content -Encoding UTF8 release-notes.md

      - name: Criar release no GitHub
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create v0.2.1 `
            dist/Navegador-v0.2.1-windows-x64.zip `
            dist/Navegador-v0.2.1-windows-x64.zip.sha256 `
            --target "${{ github.sha }}" `
            --title "Navegador v0.2.1" `
            --notes-file release-notes.md
